# 11-Class Traffic Safety System - Complete Configuration
# Updated for 2-priority system: Vehicles > Traffic Lights

ego_motion_compensator:
  ros__parameters:
    motion_threshold: 0.1               # m/s - threshold for significant motion
    confidence_penalty: 0.2             # Confidence reduction during motion
    tracking_window: 2.0                # seconds for tracking history
    vehicle_classes: [1, 2, 5, 9]       # NEW: Only motorized vehicles
    compensation_smoothing: 0.8         # Smoothing factor for compensation
    max_compensation_factor: 0.5        # Maximum compensation applied
    
    # Camera parameters (RealSense D435)
    camera_fx: 617.0
    camera_fy: 617.0
    camera_cx: 320.0
    camera_cy: 240.0
    
    # Motion compensation factors
    angular_velocity_threshold: 0.2     # rad/s

vehicle_movement_analyzer:
  ros__parameters:
    vehicle_confidence_threshold: 0.45      # Lowered from 0.6 for better car detection
    car_specific_threshold: 0.4             # Even lower threshold specifically for cars
    horizontal_threat_distance: 15.0        # meters
    motion_velocity_threshold: 2.0          # m/s
    ttc_safety_threshold: 4.0               # seconds - time to collision threshold
    tracking_window: 2.0                    # seconds for velocity calculation
    high_threat_vehicles: [1, 2, 5, 9]      # NEW: bus, car, motorcycle, truck only
    
    # RealSense D435 camera intrinsics
    camera_intrinsics:
      fx: 617.0                         # Focal length X
      fy: 617.0                         # Focal length Y
      cx: 320.0                         # Principal point X
      cy: 240.0                         # Principal point Y

crosswalk_analyzer:
  ros__parameters:
    crosswalk_threshold: 0.6            # Context detection threshold
    crosswalk_class: 3                  # NEW: Single crosswalk class

traffic_light_analyzer:
  ros__parameters:
    red_light_threshold: 0.4            # redlight (class 7) - lowered for sensitivity
    green_light_threshold: 0.3          # greenlight (class 4) - LOWERED for sensitivity (was 0.75)
    yellow_light_threshold: 0.3         # yellowlight (class 10)
    traffic_light_classes:              # NEW: All 3 colors
      greenlight: 4
      redlight: 7
      yellowlight: 10

decision_engine:
  ros__parameters:
    vehicle_override_enabled: true      # Priority 1 absolute override
    traffic_light_weight: 0.8           # Priority 2 weight
    high_confidence_threshold: 0.8
    medium_confidence_threshold: 0.6
    low_confidence_threshold: 0.4

# VLM Integration parameters (unchanged)
multimodal_safety_coordinator:
  ros__parameters:
    vlm_model_name: "llava-hf/llava-v1.6-mistral-7b-hf"
    max_response_words: 10
    vlm_timeout_seconds: 5.0
    enable_auto_explanations: true
    explanation_priority_urgent: 1
    vlm_processing_queue_size: 3        # Queue size for VLM requests
    device_map: "auto"                  # GPU/CPU device mapping
    torch_dtype: "float16"              # Memory optimization
    load_in_4bit: true       

enhanced_audio_system:
  ros__parameters:
    speech_rate_short: 180              # Fast for safety alerts
    speech_rate_long: 160               # Slower for explanations
    safety_message_priority: 1
    vlm_explanation_priority: 3
    enable_ttc_announcements: true      # Announce time-to-collision
    enable_velocity_announcements: true # Announce vehicle velocities