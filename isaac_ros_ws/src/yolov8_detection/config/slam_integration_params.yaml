# Isaac ROS Visual SLAM parameters
visual_slam_node:
  ros__parameters:
    enable_rectified_pose_tf_publisher: true
    enable_landmarks_view: true
    enable_observations_view: true
    enable_slam_visualization: true
    enable_localization_n_mapping: true
    
    # Map parameters
    path_max_size: 1024
    map_frame: "map"
    odom_frame: "odom"
    base_frame: "base_link"
    
    # Camera parameters
    input_camera_frame: "camera_color_optical_frame"
    input_left_camera_frame: "camera_infra1_optical_frame"
    input_right_camera_frame: "camera_infra2_optical_frame"

# Detection processor parameters
detection_processor:
  ros__parameters:
    obstacle_timeout: 2.0
    min_confidence: 0.6
    max_distance: 8.0
    grid_resolution: 0.05
    grid_size: 400
