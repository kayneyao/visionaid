# Taiwan Traffic Safety System Configuration
model:
  onnx_file_path: "/home/sophie/visionaid-1/models/yolov8/17class/taiwan.onnx"
  engine_file_path: "/home/sophie/visionaid-1/models/yolov8/17class/taiwan.onnx"
  force_engine_update: false
  class_count: 17  # Taiwan 17-class system

network:
  image_width: 640
  image_height: 640
  input_binding_names: ["images"]
  output_binding_names: ["output0"]

preprocessing:
  image_mean: [0.0, 0.0, 0.0]
  image_stddev: [255.0, 255.0, 255.0]
  encoding_desired: "rgb8"
  network_image_encoding: "rgb8"

detection:
  confidence_threshold: 0.5  # Consistent with camera_params
  nms_threshold: 0.4        # Consistent with camera_params
  max_detections: 50        # Consistent with camera_params

topics:
  input_image: "/camera/color/image_raw"
  output_detections: "/camera/detections"

# Taiwan class priorities for decision tree integration
taiwan_classes:
  critical_crossing: [3, 4, 5]    # crossing_crosswalk, Taiwan lights
  safety_vehicles: [0, 1, 2, 9, 12]  # All vehicles
  safety_pedestrian: [10]         # Pedestrian
  fallback_traffic: [13, 14, 15]  # Generic traffic elements
  context_classes: [6, 7, 8, 11, 16]  # Background context
