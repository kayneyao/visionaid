# 11-Class Traffic Safety System Configuration
model:
  onnx_file_path: "/home/sophie/visionaid-1/yolo_training/11classnew/models/fresh_11class.onnx"
  engine_file_path: "/home/sophie/visionaid-1/yolo_training/11classnew/models/fresh_11class.onnx"
  force_engine_update: false
  class_count: 11  # NEW: 11-class system

network:
  image_width: 640
  image_height: 640
  input_binding_names: ["images"]
  output_binding_names: ["output0"]

preprocessing:
  image_mean: [0.0, 0.0, 0.0]
  image_stddev: [255.0, 255.0, 255.0]
  encoding_desired: "rgb8"
  network_image_encoding: "rgb8"

detection:
  confidence_threshold: 0.5  # Consistent with camera_params
  nms_threshold: 0.4        # Consistent with camera_params
  max_detections: 50        # Consistent with camera_params

topics:
  input_image: "/camera/color/image_raw"
  output_detections: "/camera/detections"

# NEW: 2-Priority Safety System
safety_priorities:
  # Priority 1: Vehicle Safety (ABSOLUTE OVERRIDE)
  vehicles: [1, 2, 5, 9]        # bus, car, motorcycle, truck
  
  # Priority 2: Traffic Lights
  traffic_lights: [4, 7, 10]   # greenlight, redlight, yellowlight
  
  # Context classes (no safety override)
  pedestrian_context: [0, 6]   # bicycle, pedestrian (cross together)
  infrastructure: [3, 8]       # crosswalk, sidewalk
